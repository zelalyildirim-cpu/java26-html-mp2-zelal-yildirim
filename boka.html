<!DOCTYPE html>
<html lang="sv">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Boka bord hos Big Mamas Pizzeria i Malmö.">

    <meta name="keywords"
        content="Big Mamas, boka bord, restaurang, pizzeria, Malmö, bord">

    <title>Boka bord - Big Mamas Pizzeria</title>

    <link rel="stylesheet" href="style/style.css">

    <link rel="apple-touch-icon" sizes="180x180" href="favicon.png/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon.png/favicon-16x16.png">
    <link rel="manifest" href="favicon.png/site.webmanifest">

</head>

<body>

    <header>

        <a href="index.html" class="logo">
            Big Mamas
            <span>Pizzeria</span>
        </a>

        <img class="logo-image"
            src="https://s3-eu-west-1.amazonaws.com/qopla/68542a0996ce1e70abcff052/shop/PHOTO-2023-06-06-14-24-12.jpg"
            alt="Big Mamas logo">

        <nav>

            <a href="index.html">
                Hem
            </a>

            <a href="meny.html">
                Meny
            </a>

            <a href="boka.html">
                Boka bord
            </a>

            <a href="index.html#om-oss">
                Om oss
            </a>

        </nav>

    </header>


    <main>

        <section class="booking-page">

            <div class="booking-box">

                <p class="booking-small">
                    BIG MAMAS PIZZERIA
                </p>

                <h1>Boka bord</h1>

                <p class="booking-text">
                    Fyll i formuläret nedan för att boka
                    ett bord hos oss.
                </p>


                <form>

                    <label for="name">
                        Namn
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Ditt namn"
                        required
                    >


                    <label for="phone">
                        Telefonnummer
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Ditt telefonnummer"
                        required
                    >


                    <label for="date">
                        Datum
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        required
                    >


                    <label for="time">
                        Tid
                    </label>

                    <input
                        type="time"
                        id="time"
                        name="time"
                        required
                    >


                    <label for="people">
                        Antal personer
                    </label>

                    <select id="people" name="people">

                        <option value="1">
                            1 person
                        </option>

                        <option value="2">
                            2 personer
                        </option>

                        <option value="3">
                            3 personer
                        </option>

                        <option value="4">
                            4 personer
                        </option>

                        <option value="5">
                            5 personer
                        </option>

                        <option value="6">
                            6 personer
                        </option>

                        <option value="7">
                            7 personer
                        </option>

                        <option value="8">
                            8 personer
                        </option>

                    </select>


                    <label for="message">
                        Övriga önskemål
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="Har du något önskemål?"
                        rows="4"
                    ></textarea>


                    <button type="submit">
                        Boka bord
                    </button>

                </form>

            </div>

        </section>

    </main>


    <footer id="kontakt">

        <div class="footer-content">

            <div>
                <h3>Big Mamas Pizzeria</h3>
                <p>Bergsgatan 15, Malmö</p>
            </div>

            <div>

                <h3>Kontakt</h3>

                <p>
                    <a href="tel:+4640124395">
                        +46 40 12 43 95
                    </a>
                </p>

            </div>

            <div>

                <h3>Följ oss</h3>

                <div class="footer-social">

                    <a href="https://www.instagram.com/bigmamaspizzamalmo/"
                        target="_blank"
                        rel="noopener noreferrer">
                        Instagram
                    </a>

                    <a href="https://www.tiktok.com/discover/big-mamas-malmö"
                        target="_blank"
                        rel="noopener noreferrer">
                        TikTok
                    </a>

                    <a href="https://www.facebook.com/Recepyil/"
                        target="_blank"
                        rel="noopener noreferrer">
                        Facebook
                    </a>

                </div>

            </div>

        </div>

        <p class="copyright">
            &copy; 2026 Big Mamas Pizzeria
        </p>

    </footer>

</body>

</html>
